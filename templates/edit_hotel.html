{% extends "admin_dashboard.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Edit Hotel</h2>
    </div>
    
    <form method="POST" action="{{ url_for('edit_hotel', hotel_id=hotel.hotel_id) }}">
        
        
        <div class="form-group">
            <label for="name">Hotel Name</label>
            <input type="text" id="name" name="name" value="{{ hotel.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required>{{ hotel.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" value="{{ hotel.address }}" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" value="{{ hotel.city }}" required>
            </div>
            
            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" value="{{ hotel.country }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="star_rating">Star Rating</label>
                <select id="star_rating" name="star_rating" required>
                    {% for i in range(1, 6) %}
                    <option value="{{ i }}" {% if i == hotel.star_rating|int %}selected{% endif %}>{{ i }} ★</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="contact_phone">Contact Phone</label>
                <input type="tel" id="contact_phone" name="contact_phone" value="{{ hotel.contact_phone }}" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="contact_email">Contact Email</label>
            <input type="email" id="contact_email" name="contact_email" value="{{ hotel.contact_email }}" required>
        </div>
        
        <button type="submit" class="btn">Update Hotel</button>
        <a href="{{ url_for('manage_hotels') }}" class="btn btn-accent">Cancel</a>
    </form>
</div>
{% endblock %}
