{% extends "admin_dashboard.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Add New Hotel</h2>
    </div>
    
    <form method="POST" action="{{ url_for('add_hotel') }}" enctype="multipart/form-data">
        
        
        <div class="form-group">
            <label for="name">Hotel Name *</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>
        
        <div class="form-group">
            <label for="address">Address *</label>
            <input type="text" id="address" name="address" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="city">City *</label>
                <input type="text" id="city" name="city" required>
            </div>
            
            <div class="form-group">
                <label for="country">Country *</label>
                <input type="text" id="country" name="country" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="star_rating">Star Rating *</label>
                <select id="star_rating" name="star_rating" required>
                    <option value="1">1 ★</option>
                    <option value="2">2 ★</option>
                    <option value="3">3 ★</option>
                    <option value="4">4 ★</option>
                    <option value="5" selected>5 ★</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="primary_image">Primary Image</label>
                <input type="file" id="primary_image" name="primary_image" accept="image/*">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="contact_phone">Contact Phone *</label>
                <input type="tel" id="contact_phone" name="contact_phone" required>
            </div>
            
            <div class="form-group">
                <label for="contact_email">Contact Email *</label>
                <input type="email" id="contact_email" name="contact_email" required>
            </div>
        </div>
        
        <button type="submit" class="btn">Add Hotel</button>
        <a href="{{ url_for('manage_hotels') }}" class="btn btn-accent">Cancel</a>
    </form>
</div>
{% endblock %}
